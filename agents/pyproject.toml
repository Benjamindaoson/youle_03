[project]
name = "youle-agents"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "redis>=5.0",
    "httpx>=0.27",
    "socksio>=1.0",
    "pydantic>=2.9",
    "structlog>=24.1",
    "celery>=5.4",
    "moviepy>=1.0.3",
    "pillow>=11.0",
    "python-multipart>=0.0.9",
    "tenacity>=9.0",
    "boto3>=1.35",
    "botocore>=1.35",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # 主编排(LangGraph)与 backend 同源;运行在主服务进程内需以下依赖:
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
